version: '3.8'
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: masterchef
    ports:
      - "5433:5432"
    volumes:
      - pg_data_fresh:/var/lib/postgresql/data

volumes:
  pg_data_fresh:
